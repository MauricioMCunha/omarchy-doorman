name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject.toml; the latest stable
        # catches anything that only breaks on newer interpreters.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Compile check (broker + plugin Python sources)
        run: python3 -m py_compile broker/*.py *.py

      - name: Whitespace and conflict-marker check
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  askpass-helper:
    # The one piece of new C code parsing untrusted-length data over a
    # socket (SPEC.md §6.11) — the sanitizer build is a gate, not optional,
    # mirroring how seriously this project already treats that surface
    # (gitleaks, dependency-review-action above).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Strict build
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Wpedantic \
            -fstack-protector-strong -D_FORTIFY_SOURCE=2 \
            -o /tmp/doorman-askpass askpass/doorman-askpass.c

      - name: ASan/UBSan build
        run: |
          cc -std=c11 -O1 -g -fsanitize=address,undefined -Wall -Wextra \
            -o /tmp/doorman-askpass-asan askpass/doorman-askpass.c

      - name: Askpass identity round trip (positive path)
        run: python3 -m unittest tests.test_broker.BrokerTest.test_request_is_accepted_when_peer_egid_matches_the_trusted_gid -v

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Zero third-party dependencies today (see pyproject.toml) — this is a
      # trip wire for the day one is added, not a check with anything to
      # catch right now. Only runs on PRs: it's the only trigger the action
      # supports, since it diffs the base and head manifests.
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  package:
    # Proves the omarchy-doorman package builds from source on a real Arch
    # toolchain. Pre-release (no published tag yet) it builds from the
    # checked-out tree via a local source override; Task 4's `makepkg` against
    # the SHA-256-pinned tag tarball is the integrity-anchored build.
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tooling
        run: pacman -Sy --needed --noconfirm base-devel namcap

      - name: Create build user (makepkg refuses to run as root)
        run: |
          useradd -m builder
          cp -a "$GITHUB_WORKSPACE" /home/builder/src
          chown -R builder:builder /home/builder/src

      - name: Lint PKGBUILD and validate .SRCINFO
        run: |
          su builder -c 'cd /home/builder/src/packaging && namcap PKGBUILD || true'
          su builder -c 'cd /home/builder/src/packaging && makepkg --printsrcinfo > /dev/null'

      - name: Build the package from the checked-out tree
        run: |
          su builder -c 'set -eu
            pkgver=$(. /home/builder/src/packaging/PKGBUILD >/dev/null 2>&1; echo "$pkgver")
            work=/home/builder/pkgbuild
            mkdir -p "$work/omarchy-doorman-$pkgver"
            cp -a /home/builder/src/. "$work/omarchy-doorman-$pkgver/"
            cd "$work"
            tar czf "omarchy-doorman-$pkgver.tar.gz" "omarchy-doorman-$pkgver"
            cp /home/builder/src/packaging/PKGBUILD /home/builder/src/packaging/omarchy-doorman.install .
            sed -i "s|^source=.*|source=(\"omarchy-doorman-$pkgver.tar.gz\")|" PKGBUILD
            makepkg -f --noconfirm --skipinteg
            pkg=omarchy-doorman-$pkgver-*-x86_64.pkg.tar.zst
            echo "built:"; printf "%s\n" $pkg
            tar tf $pkg | grep -qx "usr/lib/omarchy-doorman/doorman-askpass"
            tar tf $pkg | grep -qx "usr/lib/systemd/system/omarchy-doorman.service"
            tar tf $pkg | grep -qx "usr/lib/sysusers.d/omarchy-doorman.conf"
          '

  # qmllint runs locally (scripts/qmllint-check), not here: it needs a real
  # Quickshell + Omarchy shell install to resolve Quickshell's `qs.*`
  # reserved import and the `Quickshell`/`Quickshell.Io`/`Quickshell.Wayland`
  # modules, none of which are packaged for Ubuntu/Debian. Building Quickshell
  # from source on every CI run would be disproportionate to this project's
  # size. See docs/publishing-security.md.
