name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject.toml; the latest stable
        # catches anything that only breaks on newer interpreters.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Compile check (broker + plugin Python sources)
        run: python3 -m py_compile broker/*.py *.py

      - name: Whitespace and conflict-marker check
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  askpass-helper:
    # The one piece of new C code parsing untrusted-length data over a
    # socket (SPEC.md §6.11) — the sanitizer build is a gate, not optional,
    # mirroring how seriously this project already treats that surface
    # (gitleaks, dependency-review-action above).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Strict build
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Wpedantic \
            -fstack-protector-strong -D_FORTIFY_SOURCE=2 \
            -o /tmp/doorman-askpass askpass/doorman-askpass.c

      - name: ASan/UBSan build
        run: |
          cc -std=c11 -O1 -g -fsanitize=address,undefined -Wall -Wextra \
            -o /tmp/doorman-askpass-asan askpass/doorman-askpass.c

      - name: Askpass identity round trip (positive path)
        run: python3 -m unittest tests.test_broker.BrokerTest.test_request_with_real_trusted_askpass_identity_is_accepted -v

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Zero third-party dependencies today (see pyproject.toml) — this is a
      # trip wire for the day one is added, not a check with anything to
      # catch right now. Only runs on PRs: it's the only trigger the action
      # supports, since it diffs the base and head manifests.
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  # qmllint runs locally (scripts/qmllint-check), not here: it needs a real
  # Quickshell + Omarchy shell install to resolve Quickshell's `qs.*`
  # reserved import and the `Quickshell`/`Quickshell.Io`/`Quickshell.Wayland`
  # modules, none of which are packaged for Ubuntu/Debian. Building Quickshell
  # from source on every CI run would be disproportionate to this project's
  # size. See docs/publishing-security.md.
