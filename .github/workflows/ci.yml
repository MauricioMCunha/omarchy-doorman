name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject.toml; the latest stable
        # catches anything that only breaks on newer interpreters.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Compile check (broker + plugin Python sources)
        run: python3 -m py_compile services/doorman_broker/*.py plugins/doorman/*.py

      - name: Whitespace and conflict-marker check
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
