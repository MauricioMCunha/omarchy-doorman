# Omarchy Doorman — system user and groups (installed to /usr/lib/sysusers.d/).
# Run as root by systemd-sysusers at package install (pacman hook), so the
# privileged identities exist before the .install scriptlet applies the setgid
# bit and before the service starts. See SPEC.md and the install design doc.
#
# Type Name           ID GECOS                     Home         Shell
g      doorman-askpass -
g      doorman-ui      -
u      doorman         -  "Omarchy Doorman broker" /nonexistent /usr/bin/nologin
m      doorman         doorman-askpass
m      doorman         doorman-ui
